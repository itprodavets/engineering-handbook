name: Run one lab

on:
  workflow_dispatch:
    inputs:
      question:
        description: Select a C# code challenge
        required: true
        type: string
        default: Q-024
        # The lab runner validates Q-### and requires a committed .cs file.

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Execute selected snippet
        env:
          QUESTION: ${{ inputs.question }}
        run: |
          set -euo pipefail
          echo "Executing ${QUESTION}"
          ./scripts/run-lab.sh "${QUESTION}" | tee result.txt
          {
            echo "## ${QUESTION} — output"
            echo '```text'
            cat result.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
