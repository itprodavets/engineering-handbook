name: Publish interactive handbook

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'content/**'
      - 'questions/**'
      - 'topics/**'
      - 'docs/glossary.md'
      - 'scripts/build_site.py'
      - 'scripts/check_site.py'
      - 'scripts/check_links.py'
      - '.github/workflows/pages.yml'
      - 'README.md'
      - 'README.en.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Regenerate bilingual content and site data
        run: |
          python3 scripts/build_site.py
          python3 scripts/build_units.py
      - name: Verify localization, links and source structure
        run: |
          python3 scripts/build_site.py --check
          python3 scripts/build_units.py --check
          python3 scripts/check_site.py
          python3 scripts/check_links.py
          node --test tests/mastery.test.mjs
      - name: Commit generated outputs
        run: |
          git add -A -- questions topics site README.md README.en.md
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: regenerate handbook outputs [skip ci]'
            git push origin HEAD:main
          fi
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
